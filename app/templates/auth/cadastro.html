{% extends 'base.html' %}

{% block title %}Criar Conta de Piscicultor{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-7 col-lg-6">
        <div class="card p-4 p-md-5">
            <div class="text-center mb-4">
                <i class="bi bi-person-plus text-primary fs-1"></i>
                <h3 class="fw-bold mt-2">Criar Conta</h3>
                <p class="text-muted small">Cadastre-se para monitorar a qualidade da água dos seus tanques</p>
            </div>

            <form method="POST" action="{{ url_for('auth.cadastro') }}">
                <div class="mb-3">
                    <label for="nome" class="form-label fw-semibold">Nome Completo</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control" id="nome" name="nome" value="{{ nome or '' }}" placeholder="Ex.: Maria da Silva" required autofocus>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold">Endereço de E-mail</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control" id="email" name="email" value="{{ email or '' }}" placeholder="exemplo@dominio.com" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="senha" class="form-label fw-semibold">Senha</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="senha" name="senha" placeholder="Mínimo 6 caracteres" required minlength="6">
                        </div>
                    </div>
                    <div class="col-md-6 mb-4">
                        <label for="confirmacao" class="form-label fw-semibold">Confirmar Senha</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-shield-check"></i></span>
                            <input type="password" class="form-control" id="confirmacao" name="confirmacao" placeholder="Repita a senha" required minlength="6">
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-aqua w-100 py-2 fs-6">
                    <i class="bi bi-check-circle me-1"></i> Finalizar Cadastro
                </button>
            </form>

            <div class="text-center mt-4 pt-3 border-top">
                <p class="text-muted small mb-0">
                    Já possui cadastro? 
                    <a href="{{ url_for('auth.login') }}" class="fw-semibold text-primary">Faça login</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
