{% extends 'base.html' %}

{% block title %}Entrar no Sistema{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-6 col-lg-5">
        <div class="card p-4 p-md-5">
            <div class="text-center mb-4">
                <i class="bi bi-water text-primary fs-1"></i>
                <h3 class="fw-bold mt-2">Acesso ao AquaWaterTech</h3>
                <p class="text-muted small">Informe suas credenciais para gerenciar seus tanques</p>
            </div>

            <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold">E-mail</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control" id="email" name="email" value="{{ email or '' }}" placeholder="exemplo@dominio.com" required autofocus>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="senha" class="form-label fw-semibold">Senha</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="senha" name="senha" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-aqua w-100 py-2 fs-6">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Entrar
                </button>
            </form>

            <div class="text-center mt-4 pt-3 border-top">
                <p class="text-muted small mb-0">
                    Ainda não possui uma conta? 
                    <a href="{{ url_for('auth.cadastro') }}" class="fw-semibold text-primary">Cadastre-se aqui</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
